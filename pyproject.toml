[project]
name = "py3createtorrent"
version = "2.0.0a1"
requires-python = ">=3.11"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard" # oder "strict" für maximale Typsicherheit beim Neubau

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.format]
indent-style = "space"
quote-style = "preserve"

[tool.ruff.lint]
extend-select = ["W291", "W293"]
fixable = ["FURB167", "UP024", "W291", "W293"]
ignore = ["C408", "UP031", "SIM102"]
