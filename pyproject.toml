[project]
name = "py3createtorrent"
version = "2.0.0a1"
requires-python = ">=3.11"
dependencies = [
    "bencode.py~=4.1",
]

[dependency-groups]
dev = [
    "build",
    "cachedir-tag>=0.0.5",
    "faker",
    "libtorrent>=2.0.10; python_version < '3.14'",
    "matplotlib",
    "pandas",
    "pip-audit>=2.10.1",
    "pytest>=8.0",
    "sphinx~=9.2; python_version >= '3.13'",
    "twine",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.format]
indent-style = "space"
quote-style = "preserve"

[tool.ruff.lint]
ignore = ["C408", "UP031", "SIM102"]
