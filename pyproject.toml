[project]
name = "py3createtorrent"
version = "2.0.0a1"
requires-python = ">=3.11"
dependencies = [
    "bencode.py~=4.1",
]

[dependency-groups]
dev = [
    "build",
    "faker",
    "matplotlib",
    "pandas",
    "sphinx~=7.3",
    "twine",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.format]
indent-style = "space"
quote-style = "preserve"

[tool.ruff.lint]
ignore = ["C408", "UP031", "SIM102"]
