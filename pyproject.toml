[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py3createtorrent"
version = "2.0.0a1"
description = "Create torrents via command line!"
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    { name = "Robert Nitsch", email = "mail@robertnitsch.de" },
]
keywords = ["torrents", "commandline", "shell", "script"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Topic :: Communications :: File Sharing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "bencode.py~=4.1",
]

[project.scripts]
py3createtorrent = "py3createtorrent:main"

[project.urls]
Homepage = "https://github.com/rsnitsch/py3createtorrent"
Documentation = "https://py3createtorrent.readthedocs.io/en/latest/user.html"
"Bug Reports" = "https://github.com/rsnitsch/py3createtorrent/issues"
Source = "https://github.com/rsnitsch/py3createtorrent"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["py3createtorrent"]

[dependency-groups]
dev = [
    "cachedir-tag>=0.0.5",
    "faker",
    "libtorrent>=2.0.10; python_version < '3.14'",
    "matplotlib",
    "pandas",
    "pip-audit>=2.10.1",
    "pytest>=8.0",
    "sphinx~=9.2; python_version >= '3.13'",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
executionEnvironments = [
    { root = "tests", pythonVersion = "3.13" },
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.format]
indent-style = "space"
quote-style = "preserve"

[tool.ruff.lint]
ignore = ["C408", "UP031", "SIM102"]
